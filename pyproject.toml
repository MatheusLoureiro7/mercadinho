# Padrão de código do grupo MDGS (tarefa A1).
# Verificar:  ruff check .   e   ruff format --check .
# Testes:     pytest

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["**/migrations/**", ".claude/**", "openspec/**"]  # skills e specs de terceiros

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "S105", "S106"]   # assert e senhas de mentira são o normal em teste

[tool.ruff.lint.isort]
known-first-party = ["core", "comum", "cadastro", "estoque", "vendas", "previsao", "alertas", "caixa"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
pythonpath = ["backend"]
testpaths = ["backend"]
python_files = ["test_*.py"]
markers = [
    "tela: teste no navegador, de ponta a ponta (painel → API → banco). Pular: pytest -m 'not tela'",
]
