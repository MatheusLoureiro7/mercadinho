schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projeto: Sistema de Gestão de Estoque e Compras do Mercado do Sr. João.
  Trabalho de Engenharia de Software, Grupo MDGS. Entrega em 27/11/2026.

  FONTE DA VERDADE: as Apostilas I a IV, transcritas em docs/ (REGRAS-NEGOCIO.md,
  ESPECIFICACAO.md, ARQUITETURA.md, ROTEIRO.md) e schema.sql. As specs em openspec/specs/
  são a mesma especificação no formato OpenSpec, sem nada acrescentado. Se algo não estiver
  em nenhum desses documentos, NÃO invente: registre em docs/LACUNAS.md e pergunte ao grupo.

  O sistema controla entrada, saída e validade do estoque e avisa o dono pelo Telegram.
  NÃO é sistema de caixa: só lê o arquivo exportado pelo caixa (restrição R05).

  Stack: Python 3.11+, Django 5 + Django REST Framework, PostgreSQL (fixado pela Apostila IV),
  painel em HTML/CSS/JS puro estático, pytest + pytest-django, bot do Telegram.

  Camadas (Apostila IV, seção 3) — quem está numa camada só conversa com a vizinha:
  apresentação (painel estático + Telegram) → API REST → processamento agendado às 03h00
  (importador, previsão, regras, notificação) → PostgreSQL.
  O painel nunca acessa o banco. Previsão e avisos nunca rodam no clique do usuário.
  Regra de negócio mora em módulos de serviço, não na view nem na tela.

  Nomes em português e exatamente como no schema.sql (14 tabelas). Endpoints no plural.
  Dinheiro e quantidade em Decimal. Fuso America/Sao_Paulo.

  Fora de escopo: nota fiscal, substituir o caixa, leitor de código de barras,
  vale-alimentação, fiado, contagem por foto, controle financeiro. RF16 e RF17 não entram.

  Decisões bloqueantes em aberto: D01 (formato do arquivo do caixa) e D02 (origem da
  validade) — ver docs/DECISOES-PENDENTES.md.

rules:
  proposal:
    - Citar o código da tarefa do docs/ROTEIRO.md (A1 a J6) que a mudança implementa.
    - Citar as regras de negócio (RNxx) e requisitos (RFxx/RNFxx) envolvidos.
    - Não propor tabela, coluna, tela, endpoint ou regra que não esteja na especificação.
  specs:
    - Todo requisito precisa apontar a RN, RF ou RNF de origem.
    - Usar os exemplos literais das apostilas como cenários sempre que existirem.
  design:
    - Respeitar a separação de camadas da Apostila IV, seção 3.
    - Ponto não especificado vira lacuna em docs/LACUNAS.md, não decisão no design.
  tasks:
    - Cada losango de decisão dos fluxogramas da Apostila II vira no mínimo dois testes.
    - Nomear testes pelo código da regra, por exemplo test_rn03_perecivel_sem_durabilidade_e_recusado.
    - Última tarefa sempre: marcar a tarefa como concluída em docs/ROTEIRO.md.
